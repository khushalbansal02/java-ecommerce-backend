server.port = 8085

# MongoDB Configuration (use MONGODB_HOST env var or default to localhost)
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=27017
spring.data.mongodb.database=spring-ecommerce

springdoc.api-docs.path=/api-docs

# Kafka Configurations (use KAFKA_HOST env var or default to localhost)
spring.kafka.consumer.bootstrap-servers=${KAFKA_HOST:localhost}:9092
spring.kafka.consumer.group-id=email-notification-group
spring.kafka.consumer.auto-offset-reset=earliest

