server.port=8084

# MongoDB Configuration (use MONGODB_HOST env var or default to localhost)
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=27017
spring.data.mongodb.database=spring-ecommerce

springdoc.api-docs.path=/api-docs

# Kafka Configuration (use KAFKA_HOST env var or default to localhost)
spring.kafka.producer.bootstrap-servers=${KAFKA_HOST:localhost}:9092

